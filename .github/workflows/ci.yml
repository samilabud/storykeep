name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The tests need a real Postgres: access control and idempotency are
    # enforced by the database, so a mocked database would prove nothing.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: storykeep
          POSTGRES_PASSWORD: storykeep
          POSTGRES_DB: storykeep_test
        ports:
          - 5441:5432
        options: >-
          --health-cmd "pg_isready -U storykeep -d storykeep_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Local-only test values. No real key is needed: the tests never call
      # Stripe or an LLM. They use fake keys and the mock model.
      TEST_DATABASE_URL: postgres://storykeep:storykeep@localhost:5441/storykeep_test
      DATABASE_URL: postgres://storykeep:storykeep@localhost:5441/storykeep_test
      AUTH_SECRET: ci-only-not-a-real-secret
      LLM_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Production build
        run: pnpm build
