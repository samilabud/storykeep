# Local services only. Ports are 5440/5441 so they do not clash with a
# Postgres that may already run on 5432.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: storykeep
      POSTGRES_PASSWORD: storykeep
      POSTGRES_DB: storykeep
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storykeep -d storykeep"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Separate database for tests. tmpfs = it lives in memory and starts empty.
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: storykeep
      POSTGRES_PASSWORD: storykeep
      POSTGRES_DB: storykeep_test
    ports:
      - "5441:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storykeep -d storykeep_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Catches outgoing email (dunning emails in M5). UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
